workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true

controller:
  workflowNamespaces:
    - argo-workflows

server:
  enabled: true
  authModes:
    - server
  extraArgs:
    - --secure=false

artifactRepository:
  archiveLogs: true
  s3:
    bucket: argo-artifacts
    endpoint: minio.minio.svc.cluster.local:9000
    insecure: true
    accessKeySecret:
      name: minio-artifact-secret
      key: accessKey
    secretKeySecret:
      name: minio-artifact-secret
      key: secretKey
